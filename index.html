<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Пульт куратора</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#111214);--bg2:var(--tg-theme-secondary-bg-color,#1b1c20);--tx:var(--tg-theme-text-color,#eee);
--hint:var(--tg-theme-hint-color,#8a8f98);--ac:var(--tg-theme-button-color,#2ea6ff);--act:var(--tg-theme-button-text-color,#fff);--red:#ff5a5f;--yel:#f5b83d;--grn:#3ccf7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 -apple-system,system-ui,sans-serif;padding-bottom:40px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 8px}
.tabs{display:flex;gap:6px}
.tabs button,.seg button{flex:1;border:0;border-radius:10px;padding:9px 6px;background:var(--bg2);color:var(--tx);font:600 14px/1 inherit}
.tabs button.on,.seg button.on{background:var(--ac);color:var(--act)}
.sub{color:var(--hint);font-size:12px;margin-top:6px}
main{padding:0 12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);margin:18px 2px 8px}
.card{background:var(--bg2);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-weight:650;font-size:16px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:rgba(46,166,255,.18);color:var(--ac);margin-left:6px;vertical-align:2px}
.meta{color:var(--hint);font-size:12px;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{border:0;border-radius:9px;padding:6px 9px;background:rgba(255,255,255,.07);color:var(--tx);font:13px inherit}
.chip b{font-weight:600}.chip i{font-style:normal;color:var(--hint);font-size:11px;margin-left:4px}
.big{font-weight:700;font-size:17px;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.07);margin-top:8px;overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.hot{box-shadow:inset 3px 0 0 var(--red)}
.seg{display:flex;gap:6px;margin:12px 0 4px}
.days{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:6px}
.days div{flex:1;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.days div.today{background:var(--yel)}
.dl{display:flex;gap:3px;color:var(--hint);font-size:9px;margin-top:3px}.dl span{flex:1;text-align:center}
.leg{display:flex;gap:12px;color:var(--hint);font-size:11px;margin-top:6px}.leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;display:none;padding:12px 14px 60px}
#sheet .back{border:0;background:var(--bg2);color:var(--ac);border-radius:10px;padding:8px 12px;font:600 14px inherit;position:sticky;top:0}
.txt{white-space:pre-wrap;word-break:break-word;font:13px/1.45 -apple-system,system-ui,sans-serif;margin-top:12px}
.txt .h{font-weight:700;font-size:15px;display:block;margin:14px 0 4px}
.err{padding:40px 20px;text-align:center;color:var(--hint)}
</style>
</head>
<body>
<header>
  <div class="tabs"><button id="t1" class="on" onclick="tab(1)">🗺 Карта отдела</button><button id="t2" onclick="tab(2)">💰 Расход</button></div>
  <div class="sub" id="sobrano">Загружаю…</div>
</header>
<main id="m"></main>
<div id="sheet"></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();}
let D=null,TAB=1,PER=1;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dat=t=>{const d=new Date(t*1000);return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})};
const mln=n=>n>=1e6?(n/1e6).toLocaleString('ru-RU',{maximumFractionDigits:1})+' млн':Math.round(n/1e3)+' тыс.';
const b64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));
async function load(){
  const k=new URLSearchParams(location.hash.slice(1)).get('k');
  if(!k){$('#m').innerHTML='<div class="err">Открой пульт кнопкой в боте Куратора.</div>';$('#sobrano').textContent='';return}
  try{
    const r=await fetch('d.bin?'+Date.now());const b=new Uint8Array(await r.arrayBuffer());
    const K=await crypto.subtle.importKey('raw',b64(k),'AES-GCM',false,['decrypt']);
    const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},K,b.slice(12));
    D=JSON.parse(new TextDecoder().decode(p));
  }catch(e){$('#m').innerHTML='<div class="err">Не смог открыть данные: '+esc(e.message)+'</div>';return}
  const d=new Date(D.sobrano*1000);
  $('#sobrano').textContent='Обновлено '+d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' · мак обновляет раз в 30 мин';
  if(new URLSearchParams(location.hash.slice(1)).get('t')=='2')tab(2);else draw();
}
function tab(n){TAB=n;$('#t1').classList.toggle('on',n==1);$('#t2').classList.toggle('on',n==2);draw();scrollTo(0,0)}
function draw(){if(D)$('#m').innerHTML=TAB==1?karta():rashod()}

/* ───── карта ───── */
function karta(){
  const N=Object.fromEntries(D.karta.navyki.map(n=>[n.imya,n]));
  let h='<h2>Должности · '+D.karta.agenty.length+'</h2>';
  for(const a of D.karta.agenty){
    h+='<div class="card"><div class="row"><div class="name">'+esc(a.imya)+(a.vedet?'<span class="tag">ведёт '+esc(a.vedet)+'</span>':'')+'</div></div>'+
      '<div class="meta">страница '+a.kb+' КБ · правка '+dat(a.pravka)+' · навыков '+a.navyki.length+'</div><div class="chips">'+
      (a.navyki.length?a.navyki.map(n=>chip(N[n])).join(''):'<span class="meta">своих навыков нет – работает по странице</span>')+'</div></div>';
  }
  const sv=D.karta.navyki.filter(n=>!n.kto.length);
  if(sv.length)h+='<h2>Навыки без должности · '+sv.length+'</h2><div class="card"><div class="meta">Берёт главная сессия сама, ни одна страница должности их не называет.</div><div class="chips">'+sv.map(chip).join('')+'</div></div>';
  return h;
}
function chip(n){if(!n)return'';return '<button class="chip" onclick="navyk(\''+n.imya+'\')"><b>'+esc(n.imya)+'</b><i>'+n.kb+' КБ</i></button>'}
function navyk(imya){
  const n=D.karta.navyki.find(x=>x.imya==imya);if(!n)return;
  const t=esc(n.tekst).replace(/^(#{1,4} .*)$/gm,'<span class="h">$1</span>');
  $('#sheet').innerHTML='<button class="back" onclick="zakryt()">‹ Назад</button>'+
   '<div class="card" style="margin-top:12px"><div class="name">'+esc(n.imya)+'</div>'+
   '<div class="meta">'+n.kb+' КБ · '+n.strok+' строк · справок '+n.refs+' · правка '+dat(n.pravka)+'</div>'+
   '<div class="meta">Должности: '+(n.kto.length?esc(n.kto.join(', ')):'нет')+'</div>'+
   (n.opisanie?'<div style="margin-top:8px;font-size:13px">'+esc(n.opisanie)+'</div>':'')+'</div>'+
   '<div class="txt">'+t+'</div>';
  $('#sheet').style.display='block';$('#sheet').scrollTop=0;
  if(tg){tg.BackButton.show();tg.BackButton.onClick(zakryt)}
}
function zakryt(){$('#sheet').style.display='none';if(tg)tg.BackButton.hide()}

/* ───── расход ───── */
function dni(n){const r=[];for(let i=n-1;i>=0;i--){const d=new Date(Date.now()-i*864e5);r.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))}return r}
function rashod(){
  const P={1:dni(1),2:[dni(2)[0]],7:dni(7),14:dni(14)}[PER];
  const R=D.rashod.po_kto;let rows=[],vs=[0,0,0,0];
  for(const [k,v] of Object.entries(R)){const x=[0,0,0,0];for(const d of P)if(v[d])for(let i=0;i<4;i++)x[i]+=v[d][i];if(x[0]){rows.push([k,x]);for(let i=0;i<4;i++)vs[i]+=x[i]}}
  const sum=x=>x[1]+x[2]+x[3];rows.sort((a,b)=>sum(b[1])-sum(a[1]));
  const mx=rows.length?sum(rows[0][1]):1;
  let h='<div class="seg">'+[[1,'Сегодня'],[2,'Вчера'],[7,'7 дней'],[14,'14 дней']].map(([p,t])=>'<button class="'+(PER==p?'on':'')+'" onclick="PER='+p+';draw()">'+t+'</button>').join('')+'</div>';
  // по дням
  const D14=dni(14),tot=D14.map(d=>Object.values(R).reduce((s,v)=>s+(v[d]?v[d][1]+v[d][2]+v[d][3]:0),0)),tm=Math.max(...tot,1);
  h+='<div class="card"><div class="row"><div class="name">Весь отдел</div><div class="big">Σ '+mln(sum(vs))+'</div></div>'+
     '<div class="meta">запросов '+vs[0].toLocaleString('ru-RU')+' · новое '+mln(vs[1])+' · повтор '+mln(vs[2])+' · ответ '+mln(vs[3])+'</div>'+
     '<div class="days">'+tot.map((t,i)=>'<div class="'+(i==13?'today':'')+'" style="height:'+Math.max(2,t/tm*100)+'%" title="'+mln(t)+'"></div>').join('')+'</div>'+
     '<div class="dl">'+D14.map(d=>'<span>'+d.slice(8)+'</span>').join('')+'</div></div>';
  h+='<div class="leg"><span><i style="background:var(--red)"></i>новое</span><span><i style="background:var(--ac)"></i>повтор памяти</span><span><i style="background:var(--grn)"></i>ответ</span></div>';
  h+='<h2>Кто сколько · '+rows.length+'</h2>';
  rows.forEach(([k,x],i)=>{const s=sum(x),hot=rows.length>1&&i<3&&s>0.15*sum(vs);
    h+='<div class="card'+(hot?' hot':'')+'"><div class="row"><div class="name">'+(hot?'🔴 ':'')+esc(k)+'</div><div class="big">'+mln(s)+'</div></div>'+
    '<div class="meta">запросов '+x[0]+' · новое '+mln(x[1])+' · повтор '+mln(x[2])+' · ответ '+mln(x[3])+'</div>'+
    '<div class="bar" style="width:'+Math.max(4,s/mx*100)+'%"><span style="background:var(--red);width:'+x[1]/s*100+'%"></span><span style="background:var(--ac);width:'+x[2]/s*100+'%"></span><span style="background:var(--grn);width:'+x[3]/s*100+'%"></span></div></div>'});
  if(!rows.length)h+='<div class="card meta">За этот срок расхода нет.</div>';
  // задачи работников
  const ot=Date.now()/1000-(PER==2?2:PER)*86400,Z=D.rashod.zadachi.filter(z=>z.start>=ot);
  h+='<h2>Задачи работников · '+Z.length+'</h2>';
  for(const z of Z){const s=z.t[1]+z.t[2]+z.t[3],hot=z.minut>30||s>10e6;
    h+='<div class="card'+(hot?' hot':'')+'"><div class="row"><div class="name" style="font-size:14px">'+esc(z.kto)+'</div><div class="big" style="font-size:14px">'+mln(s)+'</div></div>'+
    '<div style="font-size:13px;margin-top:4px">'+esc(z.zadanie)+'</div><div class="meta">'+dat(z.start)+(z.proekt?' · '+esc(z.proekt):'')+' · '+z.minut+' мин · запросов '+z.t[0]+'</div></div>'}
  if(!Z.length)h+='<div class="card meta">Работники за этот срок не запускались.</div>';
  return h;
}
load();
</script>
</body>
</html>
